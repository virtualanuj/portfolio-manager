spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: portfolio-manager-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  timezone: ${APP_TIMEZONE:UTC}
  pricing:
    coingecko-api-key: ${COINGECKO_API_KEY:}

management:
  endpoints:
    web:
      base-path: /api/actuator
